<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Ambient Gradients -->
    <radialGradient id="spaceAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6ee7b7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6ee7b7" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Aura -->
  <circle cx="200" cy="200" r="170" fill="url(#spaceAura)"/>

  <!-- Orbital Rings / Antigravity Circles -->
  <ellipse cx="200" cy="200" rx="150" ry="48" fill="none" stroke="rgba(125, 211, 252, 0.2)" stroke-width="1.5" stroke-dasharray="6 8" transform="rotate(-18 200 200)"/>
  <ellipse cx="200" cy="200" rx="175" ry="65" fill="none" stroke="rgba(110, 231, 183, 0.15)" stroke-width="1" stroke-dasharray="3 12" transform="rotate(25 200 200)"/>

  <!-- Ambient Floating Pixels / Tiny Stars -->
  <circle cx="70" cy="110" r="1.5" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="95" cy="280" r="1.2" fill="#6ee7b7" opacity="0.5"/>
  <circle cx="320" cy="90" r="1.5" fill="#e2e8f0" opacity="0.7"/>
  <circle cx="340" cy="260" r="2" fill="#7dd3fc" opacity="0.6"/>
  <circle cx="160" cy="60" r="1" fill="#6ee7b7" opacity="0.8"/>
  <circle cx="260" cy="330" r="1.5" fill="#38bdf8" opacity="0.6"/>

  <!-- Astronaut Group (Floating) -->
  <g id="astronaut" transform="translate(0, 0)">
    <!-- Backpack / Life Support Unit -->
    <rect x="140" y="145" width="120" height="135" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="148" y="160" width="104" height="20" rx="6" fill="#1e293b"/>
    <circle cx="165" cy="170" r="4" fill="#7dd3fc" filter="url(#neonGlow)"/>
    <circle cx="185" cy="170" r="3" fill="#6ee7b7"/>
    <circle cx="202" cy="170" r="3" fill="#38bdf8"/>

    <!-- Oxygen Tubes -->
    <path d="M 140 210 C 115 220, 115 260, 150 270" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <path d="M 260 210 C 285 220, 285 260, 250 270" fill="none" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <!-- Body / Suit Torso -->
    <path d="M 150 195 C 150 175, 250 175, 250 195 L 255 270 C 255 285, 240 295, 200 295 C 160 295, 145 285, 145 270 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="2"/>

    <!-- Chest Armor Plate & Terminal Status -->
    <rect x="170" y="215" width="60" height="42" rx="8" fill="#1e293b" stroke="rgba(125, 211, 252, 0.4)" stroke-width="1.2"/>
    <line x1="178" y1="227" x2="210" y2="227" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="178" y1="235" x2="222" y2="235" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="178" y1="243" x2="198" y2="243" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="218" cy="243" r="2.5" fill="#6ee7b7" filter="url(#neonGlow)"/>

    <!-- Left Arm (Relaxed Floating) -->
    <path d="M 150 200 C 120 220, 120 250, 135 270 C 140 278, 148 278, 146 270 C 135 255, 135 230, 156 215 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="136" cy="275" r="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

    <!-- Right Arm (Holding Float Tether or Chill) -->
    <path d="M 250 200 C 280 220, 280 250, 265 270 C 260 278, 252 278, 254 270 C 265 255, 265 230, 244 215 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="264" cy="275" r="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>

    <!-- Helmet Base / Collar -->
    <ellipse cx="200" cy="180" rx="38" ry="12" fill="#334155"/>

    <!-- Helmet Dome -->
    <circle cx="200" cy="145" r="50" fill="url(#suitGrad)" stroke="#475569" stroke-width="2.5"/>

    <!-- Visor Glass -->
    <ellipse cx="200" cy="145" rx="40" ry="32" fill="url(#visorGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>

    <!-- Visor Reflection Curve (Chill Skyline / Horizon) -->
    <path d="M 166 148 C 180 135, 220 135, 234 148 C 228 168, 172 168, 166 148 Z" fill="rgba(255, 255, 255, 0.22)"/>
    <ellipse cx="185" cy="133" rx="10" ry="4" fill="rgba(255, 255, 255, 0.45)" transform="rotate(-15 185 133)"/>

    <!-- Headset Antenna -->
    <line x1="246" y1="140" x2="260" y2="120" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="260" cy="120" r="3" fill="#7dd3fc" filter="url(#neonGlow)"/>

    <!-- Floating Zero-G Mug / Canister (Chill Detail) -->
    <g transform="translate(275, 170) rotate(15)">
      <rect x="0" y="0" width="18" height="24" rx="4" fill="#1e293b" stroke="#7dd3fc" stroke-width="1"/>
      <path d="M 18 6 C 24 6, 24 18, 18 18" fill="none" stroke="#7dd3fc" stroke-width="1.2"/>
      <line x1="4" y1="5" x2="14" y2="5" stroke="#6ee7b7" stroke-width="1"/>
      <!-- Tiny Zero-G Steam Drops -->
      <circle cx="9" cy="-6" r="1.2" fill="#7dd3fc" opacity="0.7"/>
      <circle cx="12" cy="-13" r="1" fill="#6ee7b7" opacity="0.5"/>
    </g>
  </g>

  <!-- HUD Reticle Elements -->
  <path d="M 50 70 L 40 70 L 40 80" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 350 70 L 360 70 L 360 80" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 50 330 L 40 330 L 40 320" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 350 330 L 360 330 L 360 320" fill="none" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Subtle Telemetry Text -->
  <text x="50" y="75" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="1">ORBIT::CHILL</text>
  <text x="290" y="325" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8" letter-spacing="1">G-FORCE: 0.0</text>
</svg>